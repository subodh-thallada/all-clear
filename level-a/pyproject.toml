[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levela"
version = "0.1.0"
description = "All Clear: a panel recall agent that phones every party and will not close until every panel is explained."
requires-python = ">=3.11"
dependencies = [
  "pymongo[srv]>=4.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "segno>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.setuptools.packages.find]
include = ["levela*", "seedkit*"]

[tool.setuptools.package-data]
levela = ["wall/*", "api/templates/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "e2e_*.py"]
timeout = 300
addopts = "-ra"
markers = [
  "atlas: needs a real Atlas cluster (vector search); skipped on a plain mongod",
  "slow: long-running (crash schedules, real-time e2e)",
]
