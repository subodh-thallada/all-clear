# Fly.io config for the All Clear API. From level-a/ (see deploy/README.md):
#
#   fly launch --no-deploy --copy-config --config deploy/fly.toml --name <unique-name>
#   fly secrets set --config deploy/fly.toml ATLAS_URI=... TOOL_SECRET=... ADMIN_TOKEN=...
#   fly deploy . --config deploy/fly.toml --dockerfile deploy/Dockerfile --ha=false
#
# One machine, always on: the API hosts the simulator's calls and the scheduler
# (invariants once per simulated hour), so a stopped machine checks nothing
# and a second machine would run a second scheduler. Secrets are set with
# `fly secrets set`, never here.
app = "levela-api"
primary_region = "iad"          # Ashburn, next to the Atlas cluster (AWS us-east-1)

[build]
  dockerfile = "Dockerfile"     # deploy/Dockerfile, next to this file

[env]
  PORT = "8000"
  # The API's own simulator posts back to it here.
  API_BASE_URL = "http://127.0.0.1:8000"
  ATLAS_DB = "levela"
  VOICE_PROVIDER = "elevenlabs"
  RINGING_TIMEOUT_S = "20"
  EMBED_MODEL = "voyage-4"
  EMBED_BASE_URL = "https://ai.mongodb.com/v1"
  MEMORY_ENABLED = "true"
  PLANNER = "rules"
  PLANNER_MODEL = "claude-haiku-5-5"
  REPAIR_MODEL = "claude-sonnet-5-5"
  SCHEDULER_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
