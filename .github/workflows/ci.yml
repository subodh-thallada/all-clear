# Level A: every push and pull request runs the database smoke checks, the fast
# tests and the slow ones (the long run, random kills, eight workers) against a
# MongoDB 8.0 replica set, the same server version as an Atlas free cluster.
# Tests marked `atlas` (Vector Search) skip on a plain mongod.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: workflow and operator checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: level-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            level-a/requirements.txt
            level-a/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check workflow, commands, documentation and launch scripts
        run: python -m pytest -q tests/test_docs.py tests/test_scripts.py -m "not integration"
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: level-a
    env:
      LEVELA_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            level-a/requirements.txt
            level-a/requirements-dev.txt

      - name: Start MongoDB 8.0 (replica set rs0)
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: "8.0"
          mongodb-replica-set: rs0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Database smoke tests
        run: python -m pytest -q tests/test_atlas_basics.py -m "not slow"

      - name: Fast tests
        run: python -m pytest -q -m "not slow"

      - name: Slow tests
        timeout-minutes: 20
        run: |
          set +e
          python -m pytest -q -m slow
          code=$?
          # 5 = nothing collected: no test is marked slow yet.
          if [ "$code" -eq 5 ]; then echo "No slow tests collected."; exit 0; fi
          exit "$code"

  web:
    name: workflow screen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: level-a/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: level-a/web/package-lock.json

      - name: Install screen dependencies
        run: npm ci
      - name: Screen engine tests
        run: npm test
      - name: Build workflow screen
        run: npm run build
